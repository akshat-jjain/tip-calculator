<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tip Calculator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --muted: #94a3b8;
      --text: #f8fafc;
      --accent: #2dd4bf;
      --accent-dark: #0f766e;
      --input: #0b1220;
      --error: #f87171;
      --line: #334155;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, #134e4a 0%, transparent 42%),
        var(--bg);
      color: var(--text);
      padding: 1.25rem;
    }

    .card {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(280px, 0.95fr);
      gap: 1.75rem 2rem;
      background: var(--card);
      border-radius: 1.4rem;
      padding: 1.75rem 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    header {
      grid-column: 1 / -1;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: clamp(1.4rem, 2vw, 1.85rem);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      min-width: 0;
    }

    .field {
      display: grid;
      gap: 0.55rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .field-row label {
      margin: 0;
      flex: 1 1 auto;
    }

    .control,
    .bill-control,
    .tip-control,
    .people-control {
      display: flex;
      align-items: stretch;
      min-width: min(100%, 280px);
      flex: 0 1 320px;
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      background: var(--input);
      overflow: hidden;
    }

    .bill-control select,
    .bill-control input,
    .tip-control input,
    .people-control input {
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      font-size: 1.05rem;
    }

    .bill-control select {
      width: 5.6rem;
      flex: 0 0 5.6rem;
      padding: 0.7rem 0.4rem 0.7rem 0.7rem;
      border-right: 1px solid var(--line);
      cursor: pointer;
    }

    .bill-control input,
    .tip-control input,
    .people-control input {
      width: 100%;
      min-width: 0;
      padding: 0.7rem 0.85rem;
      text-align: right;
    }

    .suffix {
      display: flex;
      align-items: center;
      padding-right: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }

    input:focus,
    select:focus {
      outline: none;
    }

    .control:focus-within,
    .bill-control:focus-within,
    .tip-control:focus-within,
    .people-control:focus-within {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: right;
    }

    .tips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tips button {
      border: 0;
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      background: #334155;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }

    .tips button.active,
    .tips button:hover {
      background: var(--accent-dark);
    }

    .results-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--input);
      border-radius: 1rem;
      padding: 1.25rem 1.35rem;
    }

    .error {
      min-height: 1.2rem;
      margin: 0 0 0.6rem;
      color: var(--error);
      font-size: 0.85rem;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 0.45rem 0;
    }

    .row span:first-child {
      color: var(--muted);
    }

    .row .value {
      font-variant-numeric: tabular-nums;
      text-align: right;
      word-break: break-all;
    }

    .row.total {
      border-top: 1px solid var(--line);
      margin-top: 0.35rem;
      padding-top: 0.85rem;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .reset {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.8rem;
      border: 0;
      border-radius: 0.7rem;
      background: var(--accent);
      color: #042f2e;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .reset:hover {
      filter: brightness(1.05);
    }

    @media (min-width: 840px) {
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        padding: 2rem 2.5rem;
      }

      .card {
        max-height: calc(100vh - 4rem);
        align-items: stretch;
      }
    }

    @media (max-width: 839px) {
      body {
        align-items: flex-start;
      }

      .card {
        grid-template-columns: 1fr;
        padding: 1.25rem;
        gap: 1.25rem;
      }

      .field-row {
        flex-wrap: wrap;
      }

      .bill-control,
      .tip-control,
      .people-control {
        flex: 1 1 100%;
        min-width: 100%;
      }

      .hint {
        text-align: left;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
      }

      .card {
        border-radius: 1rem;
      }

      .tips button {
        flex: 1 1 calc(33.33% - 0.5rem);
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <h1>Tip Calculator</h1>
      <p class="subtitle">Enter the bill, pick a tip, and split it if you like.</p>
    </header>

    <form id="tip-form" novalidate>
      <div class="field">
        <div class="field-row">
          <label for="bill">Bill amount</label>
          <div class="bill-control">
            <select id="currency" name="currency" aria-label="Currency"></select>
            <input id="bill" name="bill" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal" required>
          </div>
        </div>
        <p class="hint" id="currency-hint"></p>
      </div>

      <div class="field">
        <div class="field-row">
          <label for="tip-percent">Tip percent</label>
          <div class="tip-control">
            <input id="tip-percent" type="number" min="0" step="0.1" value="15" inputmode="decimal">
            <span class="suffix" aria-hidden="true">%</span>
          </div>
        </div>
        <div class="tips" role="group" aria-label="Tip percentage presets">
          <button type="button" data-tip="10">10%</button>
          <button type="button" data-tip="15" class="active">15%</button>
          <button type="button" data-tip="18">18%</button>
          <button type="button" data-tip="20">20%</button>
          <button type="button" data-tip="25">25%</button>
        </div>
      </div>

      <div class="field">
        <div class="field-row">
          <label for="people">Number of people</label>
          <div class="people-control">
            <input id="people" type="number" min="1" step="1" value="1">
          </div>
        </div>
      </div>
    </form>

    <aside class="results-panel">
      <p class="error" id="error" role="status"></p>
      <div class="results" aria-live="polite">
        <div class="row">
          <span>Tip</span>
          <span class="value" id="tip-amount">₹0.00</span>
        </div>
        <div class="row">
          <span>Tip per person</span>
          <span class="value" id="tip-each">₹0.00</span>
        </div>
        <div class="row total">
          <span>Total</span>
          <span class="value" id="total">₹0.00</span>
        </div>
        <div class="row">
          <span>Each person pays</span>
          <span class="value" id="each">₹0.00</span>
        </div>
      </div>
      <button class="reset" type="button" id="reset">Reset</button>
    </aside>
  </main>

  <script>
    const DEFAULT_CURRENCY = "INR";

    const CURRENCIES = {
      AED: { name: "UAE Dirham", locale: "en-AE" },
      AUD: { name: "Australian Dollar", locale: "en-AU" },
      BDT: { name: "Bangladeshi Taka", locale: "en-IN" },
      BRL: { name: "Brazilian Real", locale: "pt-BR" },
      CAD: { name: "Canadian Dollar", locale: "en-CA" },
      CHF: { name: "Swiss Franc", locale: "de-CH" },
      CNY: { name: "Chinese Yuan", locale: "zh-CN" },
      DKK: { name: "Danish Krone", locale: "da-DK" },
      EUR: { name: "Euro", locale: "de-DE" },
      GBP: { name: "British Pound", locale: "en-GB" },
      HKD: { name: "Hong Kong Dollar", locale: "zh-HK" },
      IDR: { name: "Indonesian Rupiah", locale: "id-ID" },
      INR: { name: "Indian Rupee", locale: "en-IN" },
      JPY: { name: "Japanese Yen", locale: "ja-JP" },
      KRW: { name: "South Korean Won", locale: "ko-KR" },
      KWD: { name: "Kuwaiti Dinar", locale: "en-KW" },
      LKR: { name: "Sri Lankan Rupee", locale: "en-IN" },
      MXN: { name: "Mexican Peso", locale: "es-MX" },
      MYR: { name: "Malaysian Ringgit", locale: "ms-MY" },
      NOK: { name: "Norwegian Krone", locale: "nb-NO" },
      NPR: { name: "Nepalese Rupee", locale: "en-IN" },
      NZD: { name: "New Zealand Dollar", locale: "en-NZ" },
      PHP: { name: "Philippine Peso", locale: "en-PH" },
      PKR: { name: "Pakistani Rupee", locale: "en-IN" },
      PLN: { name: "Polish Złoty", locale: "pl-PL" },
      QAR: { name: "Qatari Riyal", locale: "en-QA" },
      RUB: { name: "Russian Ruble", locale: "ru-RU" },
      SAR: { name: "Saudi Riyal", locale: "en-SA" },
      SEK: { name: "Swedish Krona", locale: "sv-SE" },
      SGD: { name: "Singapore Dollar", locale: "en-SG" },
      THB: { name: "Thai Baht", locale: "th-TH" },
      TRY: { name: "Turkish Lira", locale: "tr-TR" },
      USD: { name: "US Dollar", locale: "en-US" },
      ZAR: { name: "South African Rand", locale: "en-ZA" }
    };

    const COUNTRY_CURRENCY = {
      AE: "AED", AR: "USD", AT: "EUR", AU: "AUD", BD: "BDT", BE: "EUR",
      BR: "BRL", CA: "CAD", CH: "CHF", CL: "USD", CN: "CNY", CO: "USD",
      CZ: "EUR", DE: "EUR", DK: "DKK", EC: "USD", EE: "EUR", ES: "EUR",
      FI: "EUR", FR: "EUR", GB: "GBP", GR: "EUR", HK: "HKD", ID: "IDR",
      IE: "EUR", IN: "INR", IT: "EUR", JP: "JPY", KR: "KRW", KW: "KWD",
      LK: "LKR", LT: "EUR", LU: "EUR", LV: "EUR", MT: "EUR", MX: "MXN",
      MY: "MYR", NL: "EUR", NO: "NOK", NP: "NPR", NZ: "NZD", PE: "USD",
      PH: "PHP", PK: "PKR", PL: "PLN", PR: "USD", PT: "EUR", QA: "QAR",
      RU: "RUB", SA: "SAR", SE: "SEK", SG: "SGD", SI: "EUR", SK: "EUR",
      SV: "USD", TH: "THB", TR: "TRY", US: "USD", ZA: "ZAR"
    };

    const TZ_COUNTRY = {
      "Africa/Johannesburg": "ZA",
      "America/Chicago": "US",
      "America/Denver": "US",
      "America/Los_Angeles": "US",
      "America/Mexico_City": "MX",
      "America/New_York": "US",
      "America/Sao_Paulo": "BR",
      "America/Toronto": "CA",
      "America/Vancouver": "CA",
      "Asia/Calcutta": "IN",
      "Asia/Colombo": "LK",
      "Asia/Dhaka": "BD",
      "Asia/Dubai": "AE",
      "Asia/Hong_Kong": "HK",
      "Asia/Jakarta": "ID",
      "Asia/Karachi": "PK",
      "Asia/Kathmandu": "NP",
      "Asia/Kolkata": "IN",
      "Asia/Kuala_Lumpur": "MY",
      "Asia/Kuwait": "KW",
      "Asia/Manila": "PH",
      "Asia/Qatar": "QA",
      "Asia/Riyadh": "SA",
      "Asia/Seoul": "KR",
      "Asia/Shanghai": "CN",
      "Asia/Singapore": "SG",
      "Asia/Tokyo": "JP",
      "Australia/Melbourne": "AU",
      "Australia/Sydney": "AU",
      "Europe/Amsterdam": "NL",
      "Europe/Berlin": "DE",
      "Europe/London": "GB",
      "Europe/Madrid": "ES",
      "Europe/Moscow": "RU",
      "Europe/Paris": "FR",
      "Europe/Rome": "IT",
      "Europe/Stockholm": "SE",
      "Europe/Warsaw": "PL",
      "Europe/Zurich": "CH",
      "Pacific/Auckland": "NZ"
    };

    const billInput = document.getElementById("bill");
    const peopleInput = document.getElementById("people");
    const tipInput = document.getElementById("tip-percent");
    const currencySelect = document.getElementById("currency");
    const currencyHint = document.getElementById("currency-hint");
    const errorEl = document.getElementById("error");
    const tipButtons = document.querySelectorAll(".tips button");

    let userPickedCurrency = false;

    function fillCurrencyOptions() {
      const codes = Object.keys(CURRENCIES).sort((a, b) => {
        if (a === DEFAULT_CURRENCY) return -1;
        if (b === DEFAULT_CURRENCY) return 1;
        return CURRENCIES[a].name.localeCompare(CURRENCIES[b].name);
      });

      currencySelect.innerHTML = codes.map((code) => {
        const { name } = CURRENCIES[code];
        return `<option value="${code}" title="${name}">${code}</option>`;
      }).join("");
    }

    function money(value) {
      const code = currencySelect.value || DEFAULT_CURRENCY;
      const locale = (CURRENCIES[code] && CURRENCIES[code].locale) || "en-IN";
      return new Intl.NumberFormat(locale, {
        style: "currency",
        currency: code
      }).format(value);
    }

    function setCurrency(code, hint) {
      const next = CURRENCIES[code] ? code : DEFAULT_CURRENCY;
      currencySelect.value = next;
      currencyHint.textContent = hint || "";
      calculate();
    }

    function countryFromLanguage() {
      const tags = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language];

      for (const tag of tags) {
        try {
          const region = new Intl.Locale(tag).region;
          if (region && COUNTRY_CURRENCY[region]) {
            return region;
          }
        } catch (error) {
          const match = String(tag).match(/-([A-Z]{2})\b/i);
          if (match) {
            const region = match[1].toUpperCase();
            if (COUNTRY_CURRENCY[region]) return region;
          }
        }
      }
      return null;
    }

    function countryFromTimeZone() {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      return TZ_COUNTRY[tz] || null;
    }

    async function countryFromIP() {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 2500);
      try {
        const response = await fetch("https://api.country.is/", {
          signal: controller.signal
        });
        if (!response.ok) return null;
        const data = await response.json();
        const country = data && data.country;
        return COUNTRY_CURRENCY[country] ? country : null;
      } catch (error) {
        return null;
      } finally {
        clearTimeout(timer);
      }
    }

    async function detectCurrency() {
      const localCountry = countryFromTimeZone() || countryFromLanguage();
      if (localCountry) {
        setCurrency(
          COUNTRY_CURRENCY[localCountry],
          `Selected from your location (${localCountry}). You can change it anytime.`
        );
      } else {
        setCurrency(DEFAULT_CURRENCY, "Defaulted to INR. Change it if you pay in another currency.");
      }

      const ipCountry = await countryFromIP();
      if (userPickedCurrency || !ipCountry) return;

      setCurrency(
        COUNTRY_CURRENCY[ipCountry],
        `Selected from your country (${ipCountry}). You can change it anytime.`
      );
    }

    function syncTipButtons() {
      const value = Number(tipInput.value);
      tipButtons.forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.tip) === value);
      });
    }

    function calculate() {
      const bill = Number(billInput.value);
      const people = Number(peopleInput.value);
      const tipPercent = Number(tipInput.value);

      errorEl.textContent = "";

      if (billInput.value === "") {
        setResults(0, 1);
        return;
      }

      if (!Number.isFinite(bill) || bill < 0) {
        errorEl.textContent = "Bill amount must be zero or greater.";
        setResults(0, 1);
        return;
      }

      if (tipInput.value === "" || !Number.isFinite(tipPercent) || tipPercent < 0) {
        errorEl.textContent = "Tip percent must be zero or greater.";
        setResults(0, 1);
        return;
      }

      if (!Number.isInteger(people) || people < 1) {
        errorEl.textContent = "Split between at least one person.";
        setResults(0, 1);
        return;
      }

      setResults(bill * (tipPercent / 100), people, bill);
    }

    function setResults(tip, people, bill = 0) {
      const total = bill + tip;
      document.getElementById("tip-amount").textContent = money(tip);
      document.getElementById("tip-each").textContent = money(tip / people);
      document.getElementById("total").textContent = money(total);
      document.getElementById("each").textContent = money(total / people);
    }

    tipButtons.forEach((button) => {
      button.addEventListener("click", () => {
        tipInput.value = button.dataset.tip;
        syncTipButtons();
        calculate();
      });
    });

    [billInput, peopleInput].forEach((input) => {
      input.addEventListener("input", calculate);
    });

    tipInput.addEventListener("input", () => {
      syncTipButtons();
      calculate();
    });

    currencySelect.addEventListener("change", () => {
      userPickedCurrency = true;
      const code = currencySelect.value;
      currencyHint.textContent = `Using ${code} (${CURRENCIES[code].name}).`;
      calculate();
    });

    document.getElementById("reset").addEventListener("click", () => {
      billInput.value = "";
      peopleInput.value = "1";
      tipInput.value = "15";
      syncTipButtons();
      errorEl.textContent = "";
      setResults(0, 1);
      billInput.focus();
    });

    fillCurrencyOptions();
    setCurrency(DEFAULT_CURRENCY, "Defaulted to INR. Detecting your country…");
    detectCurrency();
  </script>
</body>
</html>
